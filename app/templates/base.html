<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Nutty Pelican Event Agent{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('main.dashboard') }}">The Nutty Pelican <span>Event Agent</span></a>
    <nav><a href="{{ url_for('main.dashboard') }}">Pipeline</a><a class="button" href="{{ url_for('main.event_new') }}">+ Add event</a></nav>
  </header>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer>Local-first V1 · Outreach from EventPlanning@thenuttypelican.com · Protected actions always require Joe</footer>
</body>
</html>
